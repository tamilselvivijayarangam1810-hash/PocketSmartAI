{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Welcome back</h1>
  <p>Login to save and review your plans.</p>
  <form id="loginForm">
    <label>Email<input name="email" type="email" required></label>
    <label>Password<input name="password" type="password" minlength="6" required></label>
    <button class="btn primary" type="submit">Login</button>
  </form>
  <div id="message" class="message"></div>
  <p>New here? <a href="/register">Create an account</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  const r = await api("/api/login", {method:"POST", body: JSON.stringify(body)});
  if (r.ok) {
    document.cookie = "access_token=" + r.token + "; Path=/; SameSite=Lax";
    location.href = "/dashboard";
  } else document.getElementById("message").textContent = r.message || "Login failed";
});
</script>
{% endblock %}
